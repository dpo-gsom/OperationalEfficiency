<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Где тормозит поток</title>
<link rel="stylesheet" href="styles.css">
<style>
  /* ─── Экран: фиксированная высота, чтобы iframe не прыгал ─── */
  .screen { min-height: 1040px; }
  .screen__body { flex: 1; display: flex; flex-direction: column; }
  .screen__body--center { justify-content: center; }

  /* ─── Предложение ─── */
  .prop { padding: 11px 16px; }
  .prop__who { font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--red); }
  .prop__text { font-size: 14px; color: var(--dark); line-height: 1.5; margin-top: 4px; }
  .ctx { font-size: 12.5px; line-height: 1.45; color: var(--slate); }
  .ctx b { color: var(--dark); font-weight: 600; }

  /* ─── Схема: компактная полоса отделов ─── */
  .flow-label { font-size: 12px; font-weight: 600; color: var(--slate); letter-spacing: .03em; text-transform: uppercase; }
  .flow { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; }
  .st {
    position: relative;
    padding: 5px 8px;
    background: var(--white);
    border: 1.5px solid var(--border);
    border-radius: var(--radius-md);
    min-width: 0;
    display: flex; flex-direction: column; justify-content: center;
  }
  .st + .st::before {
    content: '';
    position: absolute;
    left: -13px; top: 50%;
    width: 11px; height: 2px;
    background: var(--border);
  }
  .st + .st::after {
    content: '';
    position: absolute;
    left: -5px; top: calc(50% - 4px);
    border: 5px solid transparent;
    border-left-color: var(--border);
    border-right: 0;
  }
  .st__name { font-size: 12.5px; font-weight: 700; color: var(--dark); line-height: 1.2; text-align: center; }
  .st__cap { font-size: 11px; color: var(--slate); line-height: 1.3; margin-top: 2px; }
  .st__cap b { color: var(--dark); font-weight: 600; }

  .old { font-weight: 400; color: var(--slate); opacity: .7; }
  .nw-up { color: var(--green); font-weight: 700; }
  .nw-down { color: var(--red); font-weight: 700; }
  .tbl-note { font-size: 11.5px; color: var(--slate); line-height: 1.4; }

  .st--btn, .tr--btn { cursor: pointer; }
  .st--btn { transition: box-shadow .15s, transform .15s; }
  .st--btn:hover { box-shadow: 0 3px 10px rgba(0, 59, 72, .12); transform: translateY(-1px); }
  .st--picked { outline: 2.5px solid var(--dark); outline-offset: 1px; }

  /* ─── Таблица расчёта ─── */
  .tbl { width: 100%; border-collapse: separate; border-spacing: 0; background: var(--white); border: 1.5px solid var(--border); border-radius: var(--radius-md); overflow: hidden; font-size: 13px; }
  .tbl th { font-size: 10.5px; font-weight: 600; letter-spacing: .02em; text-transform: uppercase; color: var(--slate); text-align: right; padding: 5px 10px 4px; background: var(--sand); line-height: 1.25; vertical-align: bottom; }
  .tbl th:first-child, .tbl td:first-child { text-align: left; }
  .tbl td { padding: 4px 10px; border-top: 1px solid var(--border); text-align: right; color: var(--dark); font-weight: 600; line-height: 1.3; white-space: nowrap; }
  .tbl td:first-child { font-weight: 600; white-space: normal; }
  .tbl small { font-size: 11px; font-weight: 400; color: var(--slate); }
  .tbl .none { color: var(--border); font-weight: 400; }
  .tr--btn:hover td { background: var(--sand); }
  .tr--picked td { background: var(--sand); }
  .tr--picked td:first-child { box-shadow: inset 3px 0 0 var(--dark); }

  /* ─── Формулы ─── */
  .res { display: flex; flex-direction: column; gap: 6px; }
  .res__tile { padding: 5px 12px; background: var(--white); border: 1.5px solid var(--border); border-radius: var(--radius-md); display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .res__lbl { font-size: 12.5px; font-weight: 600; color: var(--dark); line-height: 1.3; }
  .res__f { font-size: 12px; color: var(--slate); line-height: 1.4; margin-top: 1px; }
  .res__val { font-family: var(--font-display); font-size: 19px; font-weight: 900; color: var(--dark); white-space: nowrap; }
  .res__val s { color: var(--slate); font-weight: 700; font-size: 15px; text-decoration: none; opacity: .6; }
  .res__val--up { color: var(--green); }
  .res__val--down { color: var(--red); }

  /* ─── Решение ─── */
  .dec { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .dec .card { padding: 11px 12px; text-align: center; font-size: 14px; font-weight: 600; color: var(--dark); }
  .dec--locked .card { cursor: default; pointer-events: none; }

  /* ─── Разбор ─── */
  .fb-zone { min-height: 150px; display: flex; flex-direction: column; }
  .fb-zone p + p { margin-top: 7px; }
  .fb-zone .hint {
    font-size: 13px;
    color: var(--slate);
    text-align: center;
    padding: 18px 10px;
    border: 1.5px dashed var(--border);
    border-radius: var(--radius-md);
  }
  .levels { margin-top: 9px; padding-top: 8px; border-top: 1px solid rgba(0, 0, 0, .08); display: flex; flex-direction: column; gap: 4px; }
  .lvl { display: flex; gap: 8px; align-items: baseline; font-size: 13px; line-height: 1.4; color: var(--slate); }
  .lvl b { color: var(--dark); font-weight: 600; }
  .dot { flex-shrink: 0; width: 9px; height: 9px; border-radius: 50%; position: relative; top: 1px; }
  .dot--ok  { background: var(--green); }
  .dot--mid { background: #D9A400; }
  .dot--bad { background: var(--red); }
  .def { margin-top: 8px; padding: 8px 10px; background: rgba(255, 255, 255, .6); border-radius: 6px; font-size: 13px; line-height: 1.45; }

  /* ─── Итоговый экран ─── */
  .sum { display: flex; flex-direction: column; gap: 6px; }
  .sum__row { display: flex; gap: 10px; align-items: flex-start; padding: 9px 12px; background: var(--white); border: 1.5px solid var(--border); border-radius: var(--radius-md); }
  .sum__row .dot { top: 5px; }
  .sum__main { flex: 1; min-width: 0; }
  .sum__step { font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--slate); }
  .sum__text { font-size: 14px; color: var(--dark); line-height: 1.4; }
  .sum__calc { font-size: 12px; color: var(--slate); line-height: 1.45; margin-top: 3px; }
  .sum__eff { flex-shrink: 0; font-size: 13px; font-weight: 700; color: var(--dark); text-align: right; padding-top: 2px; max-width: 230px; }

  @media (max-width: 560px) {
    .flow { gap: 8px; }
    .st { padding: 5px 4px; text-align: center; }
    .st + .st::before { left: -8px; width: 7px; }
    .st + .st::after { display: none; }
    .st__name { font-size: 10.5px; hyphens: auto; }
    .tbl { font-size: 12px; table-layout: fixed; }
    .tbl th:first-child { width: 27%; }
    .tbl td { white-space: normal; }
    .tbl td:first-child { font-size: 11px; line-height: 1.2; }
    .tbl .old { display: block; font-size: 10.5px; }
    .tbl .pct { display: none; }
    .tbl th { text-transform: none; font-size: 10px; }
    .tbl th { font-size: 9.5px; padding: 6px 5px 5px; letter-spacing: 0; }
    .tbl td { padding: 5px 5px; }
    .tbl th:first-child, .tbl td:first-child { padding-left: 8px; }
    .tbl small { display: block; font-size: 10px; }
    .res__tile { padding: 7px 10px; }
    .res__val { font-size: 17px; }
    .fb-zone { min-height: 196px; }
    .sum__row { flex-wrap: wrap; }
    .sum__eff { flex-basis: 100%; text-align: left; padding: 0 0 0 19px; max-width: none; }
    .screen { min-height: 1510px; }
  }
</style>
</head>
<body>

<div id="app"></div>

<script src="common.js"></script>
<script>
/* =========================================================
   Где тормозит поток
   Банк выдаёт кредиты малому бизнесу: заявка проходит пять отделов.
   Три предложения руководителей отделов (поддержать или нет)
   и одно улучшение на выбор — найти узкое место.
   Принятые решения сохраняются и меняют процесс в следующих раундах.
   Поток считается по модели: каждый отдел обрабатывает не больше
   того, что успевает, остальное копится в очереди.
   Расчёт виден целиком: схема, таблица по отделам и формулы.
   ========================================================= */

var DAYS = 20;      // рабочих дней в месяце
var PROMISE = 5;    // банк обещает клиенту решение и деньги за 5 рабочих дней

var NAMES = ['Маркетинг', 'Продажи', 'Кредитный анализ', 'Юристы', 'Выдача денег'];
/* Для формулы нарушений срока: куда поступает поток */
var QWHERE = ['', 'В продажи', 'В анализ', 'К юристам', 'На выдачу'];

/* Параметры процесса зависят от принятых решений:
   r1 — премия продажам, r2 — система для юристов, r3 — новая реклама,
   boost — отдел, куда взяли двух сотрудников (−1 — никуда).
   Числа подобраны так, что на любом пути все потоки — целые */
function params(f) {
  var p = {
    L:  f.r3 ? 24 : 30,
    Cs: 30,
    k:  f.r1 ? 1 : (f.r3 ? 5 / 6 : 2 / 3),
    Ca: 16,
    a:  f.r3 ? (f.r1 ? 0.5 : 0.75) : (f.r1 ? 0.25 : 0.5),
    Cl: f.r2 ? 24 : 15,
    Cp: 20
  };
  if (f.boost === 0) p.L += 8;
  if (f.boost === 1) p.Cs += 10;
  if (f.boost === 2) p.Ca += 4;
  if (f.boost === 3) p.Cl += 6;
  if (f.boost === 4) p.Cp += 8;
  return p;
}

/* Модель потока: по каждому отделу — поступает, успевает, передаёт дальше
   и сколько заявок в день не успевает в срок. Такие заявки разбирают
   на следующий день, но обещанные 5 дней для клиента уже нарушены */
function sim(p) {
  var st = [];
  st.push({ cap: p.L, inn: null, out: p.L, q: 0, wait: 0 });
  var x = p.L;
  var caps = [p.Cs, p.Ca, p.Cl, p.Cp];
  var pass = [p.k, p.a, 1, 1];
  var wait = 0;
  for (var i = 0; i < 4; i++) {
    var done = Math.min(x, caps[i]);
    var q = Math.max(0, x - caps[i]);
    var w = q * DAYS / caps[i];
    st.push({ cap: caps[i], inn: x, out: done * pass[i], pass: pass[i], q: q, wait: w });
    wait += w;
    x = done * pass[i];
  }
  var late = 0;
  for (var j = 1; j < st.length; j++) late += st[j].q * DAYS;
  return { st: st, daily: x, month: Math.round(x * DAYS), late: Math.round(late), p: p };
}

var ROUNDS = [
  {
    who: 'Руководитель продаж',
    text: 'Предлагает платить менеджерам премию за каждую заявку, переданную в кредитный анализ. Сейчас менеджер ещё на первом звонке отсеивает компании, которым кредит заведомо не одобрят. С премией он будет передавать в анализ всех. Руководитель продаж признаёт, что слабых заявок станет больше, но считает, что доля одобренных снизится незначительно.',
    right: 'no',
    tag: 'эффект домино',
    sum: 'Премия продажам за число заявок',
    ctx: 'премию продажам',
    off: 'Без премии', on: 'С премией'
  },
  {
    who: 'Руководитель юридического отдела',
    text: 'Просит 3 млн ₽ на шаблоны и систему для подготовки договоров. Юристы смогут готовить 24 договора в день вместо 15.',
    right: 'no',
    tag: 'не тот отдел',
    sum: 'Система для юристов за 3 млн ₽',
    ctx: 'систему для юристов',
    off: 'Без системы', on: 'С системой'
  },
  {
    who: 'Руководитель маркетинга',
    text: function (p0, p1) {
      return 'Сейчас маркетинг отчитывается числом обращений. Руководитель предлагает показывать рекламу только компаниям, которые работают больше года, а оценивать маркетинг по доле одобренных заявок. '
        + 'Обращений станет 24 в день вместо 30. Зато клиенты будут надёжнее: '
        + (same(p0.k, p1.k) ? '' : 'продажи станут оформлять в заявку ' + pct(p1.k) + ' обращений вместо ' + pct(p0.k) + ', а ')
        + 'кредитный анализ будет одобрять ' + pct(p1.a) + ' заявок вместо ' + pct(p0.a) + '.';
    },
    right: 'yes',
    tag: 'цепная реакция',
    sum: 'Новая реклама и KPI маркетинга',
    ctx: 'новую рекламу',
    off: 'Со старой рекламой', on: 'С новой рекламой'
  }
];

var DEF = '<b>Узкое место</b> — отдел, который не успевает за входящим потоком. Он не успевает разобрать всё в срок и задаёт скорость всей цепочке. Здесь это кредитный анализ. Пока его не расширили, ускорять остальных бесполезно.';

var state = { screen: 'intro', i: 0, answers: [] };

/* ─── Вспомогательные ───────────────────────────────────── */

function fmt(x) {
  var r = Math.round(x * 10) / 10;
  return String(r).replace('.', ',');
}

function pl(n, one, few, many) {
  var r = Math.round(n * 10) / 10;
  if (r % 1 !== 0) return few;
  var m10 = r % 10, m100 = r % 100;
  if (m10 === 1 && m100 !== 11) return one;
  if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return few;
  return many;
}
function kr(n) { return fmt(n) + ' ' + pl(n, 'кредит', 'кредита', 'кредитов'); }
function zv(n) { return fmt(n) + ' ' + pl(n, 'заявка', 'заявки', 'заявок'); }
function pct(x) { return Math.round(x * 100) + '%'; }
function same(a, b) { return Math.abs(a - b) < 0.01; }

/* Флаги решений до раунда n (не включая его) */
function flagsBefore(n) {
  var a = state.answers;
  return {
    r1: n > 0 && a[0] === 'yes',
    r2: n > 1 && a[1] === 'yes',
    r3: n > 2 && a[2] === 'yes',
    boost: -1
  };
}

/* Флаги, если в раунде n принять предложение (или взять людей в отдел v) */
function flagsWith(n, v) {
  var f = flagsBefore(n);
  if (n === 0) f.r1 = v === 'yes';
  if (n === 1) f.r2 = v === 'yes';
  if (n === 2) f.r3 = v === 'yes';
  if (n === 3) f.boost = v;
  return f;
}

function answered() { return state.answers[state.i] !== undefined; }

function preP() { return params(flagsBefore(state.i)); }
function curP() { return answered() ? params(flagsWith(state.i, state.answers[state.i])) : preP(); }
function finalP() { return params(flagsWith(3, state.answers[3])); }

/* Число с подсветкой, если изменилось: «было → стало» */
/* Изменение в таблице: старое значение зачёркнуто, новое рядом.
   Рост — зелёным, снижение — красным; inv — наоборот (для нарушений срока) */
function chg(newTxt, oldTxt, up) {
  return '<s class="old">' + oldTxt + '</s> <span class="' + (up ? 'nw-up' : 'nw-down') + '">' + newTxt + '</span>';
}
function num(v, ref, inv) {
  if (ref === undefined || ref === null || same(v, ref)) return fmt(v);
  return chg(fmt(v), fmt(ref), (v > ref) !== !!inv);
}

/* Не успевают в срок: без цвета, «—», если все успевают */
function qCell(v, ref) {
  function t(x) { return x > 0.01 ? fmt(x) : '—'; }
  if (same(v, ref)) return v > 0.01 ? t(v) : '<span class="none">—</span>';
  return chg(t(v), t(ref), v < ref);
}

function pctChg(v, ref) { return same(v, ref) ? pct(v) : chg(pct(v), pct(ref), v > ref); }

function sameP(a, b) {
  for (var k in a) if (!same(a[k], b[k])) return false;
  return true;
}

/* ─── Схема ─────────────────────────────────────────────── */

function flowHtml(p, mode, ref) {
  var s = sim(p), b = sim(ref || p);
  var h = '<div class="flow" id="flow">';
  for (var i = 0; i < 5; i++) {
    var cls = 'st';
    if (mode === 'pick') cls += ' st--btn';
    if (mode === 'picked' && state.answers[3] === i) cls += ' st--picked';
    h += '<div class="' + cls + '"' + (mode === 'pick' ? ' onclick="pickBoost(' + i + ')"' : '') + '>'
      + '<div class="st__name">' + NAMES[i] + '</div>'
      + '</div>';
  }
  return h + '</div>';
}

/* ─── Таблица расчёта ───────────────────────────────────── */

function tableHtml(p, mode, ref) {
  var s = sim(p), b = sim(ref || p);
  var inUnit  = ['', 'обращ.', 'заявок', 'заявок', 'договоров'];
  var h = '<table class="tbl" id="tbl"><thead><tr>'
    + '<th>Отдел</th><th>Поступает<br>в день</th><th>Успевает<br>в день</th><th>Передаёт<br>дальше</th><th>Не успевает<br>в срок</th>'
    + '</tr></thead><tbody>';
  for (var i = 0; i < 5; i++) {
    var st = s.st[i], bs = b.st[i];
    var cls = '';
    if (mode === 'pick') cls = 'tr--btn';
    if (mode === 'picked' && state.answers[3] === i) cls = 'tr--picked';
    var outUnit;
    if (i === 0) outUnit = 'обращений';
    else if (i === 1) outUnit = 'заявок<span class="pct"> · ' + pctChg(st.pass, bs.pass) + '</span>';
    else if (i === 2) outUnit = 'одобрено<span class="pct"> · ' + pctChg(st.pass, bs.pass) + '</span>';
    else if (i === 3) outUnit = 'договоров';
    else outUnit = 'кредитов';
    h += '<tr' + (cls ? ' class="' + cls + '"' : '') + (mode === 'pick' ? ' onclick="pickBoost(' + i + ')"' : '') + '>'
      + '<td>' + NAMES[i] + '</td>'
      + '<td>' + (i === 0 ? '<span class="none">—</span>' : num(st.inn, bs.inn) + ' <small>' + inUnit[i] + '</small>') + '</td>'
      + '<td>' + num(st.cap, bs.cap) + '</td>'
      + '<td>' + num(st.out, bs.out) + ' <small>' + outUnit + '</small></td>'
      + '<td>' + qCell(st.q, bs.q) + '</td>'
      + '</tr>';
  }
  return h + '</tbody></table>';
}

/* ─── Формулы итога ─────────────────────────────────────── */

function lateFormula(s) {
  var parts = [];
  for (var i = 1; i < 5; i++) {
    var st = s.st[i];
    if (st.q <= 0.01) continue;
    parts.push(QWHERE[i] + ' поступает ' + fmt(st.inn) + ', успевают ' + fmt(st.cap) + ': ' + fmt(st.q) + ' в день × ' + DAYS + ' дн. = ' + fmt(st.q * DAYS));
  }
  if (!parts.length) return 'Все отделы успевают — заявки укладываются в ' + PROMISE + ' дней';
  return parts.join('; ');
}

function resHtml(p, ref) {
  var s = sim(p), b = sim(ref || p);
  function val(v, bv, unit, upGood) {
    var cls = 'res__val', txt = fmt(v) + unit;
    if (!same(v, bv)) {
      cls += ((v > bv) === upGood) ? ' res__val--up' : ' res__val--down';
      txt = '<s>' + fmt(bv) + ' →</s> ' + txt;
    }
    return '<span class="' + cls + '">' + txt + '</span>';
  }
  return '<div class="res" id="res">'
    + '<div class="res__tile"><div><div class="res__lbl">Кредитов за месяц</div>'
    +   '<div class="res__f">' + fmt(s.daily) + ' ' + pl(s.daily, 'кредит', 'кредита', 'кредитов') + ' в день × ' + DAYS + ' рабочих дней</div></div>'
    +   val(s.month, b.month, '', true) + '</div>'
    + '<div class="res__tile"><div><div class="res__lbl">Заявок с нарушением срока за месяц</div>'
    +   '<div class="res__f">' + lateFormula(s) + '</div></div>'
    +   val(s.late, b.late, '', false) + '</div>'
    + '</div>';
}

function calcHtml(p, mode, ref) {
  return '<div id="flowbox">' + flowHtml(p, mode, ref) + '</div>'
    + '<div class="mt-xs" id="tblbox">' + tableHtml(p, mode, ref) + '</div>'
    + (ref && !sameP(p, ref) ? '<div class="tbl-note mt-xs">Зачёркнуто — как было до решения. Зелёным — стало больше, красным — меньше; в столбце «Не успевает в срок» наоборот.</div>' : '')
    + '<div class="mt-xs" id="resbox">' + resHtml(p, ref) + '</div>';
}

function progressHtml() {
  return '<div class="progress">'
    + '<div class="progress__meta">'
    +   '<span class="progress__label">Раунд</span>'
    +   '<span class="progress__fraction"><em>' + (state.i + 1) + '</em> / 4</span>'
    + '</div>'
    + '<div class="progress__track"><div class="progress__fill" style="width:' + (state.i / 4 * 100) + '%"></div></div>'
    + '</div>';
}

/* Откуда взялись текущие цифры: какие решения уже изменили процесс */
function ctxHtml() {
  if (state.i === 0) return '';
  var items = [];
  for (var k = 0; k < state.i; k++) {
    if (state.answers[k] !== 'yes') continue;
    var m0 = sim(params(flagsBefore(k))).month, m1 = sim(params(flagsWith(k, 'yes'))).month;
    items.push('<b>' + ROUNDS[k].ctx + '</b> (' + m0 + ' → ' + kr(m1) + ')');
  }
  var t = items.length
    ? 'Ваши решения уже изменили процесс: вы поддержали ' + items.join(', ') + '.'
    : 'Вы пока ничего не меняли — процесс такой же, как в начале.';
  return '<div class="ctx mt-xs">' + t + '</div>';
}

function decHtml() {
  var r = ROUNDS[state.i], ans = state.answers[state.i];
  var opts = [['yes', 'Поддержать'], ['no', 'Не поддерживать']];
  var h = '<div class="dec' + (ans !== undefined ? ' dec--locked' : '') + '" id="dec">';
  for (var k = 0; k < 2; k++) {
    var cls = 'card';
    if (ans === undefined) cls += ' card--interactive';
    else if (opts[k][0] === r.right) cls += ' card--correct';
    else if (opts[k][0] === ans) cls += ' card--wrong';
    else cls += ' card--dimmed';
    h += '<div class="' + cls + '"' + (ans === undefined ? ' onclick="decide(\'' + opts[k][0] + '\')"' : '') + '>' + opts[k][1] + '</div>';
  }
  return h + '</div>';
}

function linesHtml(lines) {
  var h = '<div class="levels">';
  for (var k = 0; k < lines.length; k++) {
    h += '<div class="lvl"><span class="dot dot--' + lines[k][0] + '"></span><span><b>' + lines[k][1] + ':</b> ' + lines[k][2] + '</span></div>';
  }
  return h + '</div>';
}

/* ─── Разборы: тексты считаются от текущего состояния процесса ─── */

function lateChange(l0, l1) {
  if (l1 === 0 && l0 > 0) return 'нарушений срока больше нет — было ' + l0 + ' в месяц';
  if (l1 !== l0) return 'заявок с нарушением срока стало ' + l1 + ' вместо ' + l0;
  return 'заявок с нарушением срока столько же — ' + l1;
}

/* s0 — процесс до раунда, s1 — если принять предложение */
function roundBody(n, yes, s0, s1) {
  var m0 = s0.month, m1 = s1.month, d0 = s0.late, d1 = s1.late;
  if (n === 0) {
    var apps0 = fmt(s0.st[2].inn), apps1 = fmt(s1.st[2].inn);
    if (yes) {
      return '<p>KPI продаж вырос: заявок в анализ стало ' + apps1 + ' в день вместо ' + apps0 + '. Но среди них много компаний, которые раньше отсеялись бы на первом звонке. Аналитики успевают разобрать только ' + s1.p.Ca + ' заявок в день, остальные разбирают с нарушением срока, а одобряют теперь только ' + pct(s1.p.a) + '. Банк выдаёт за месяц ' + kr(m1) + ' вместо ' + m0 + ', а обещанные ' + PROMISE + ' дней нарушены уже у ' + zv(d1) + ' в месяц вместо ' + d0 + '.</p>'
        + linesHtml([['bad', 'Кредитный анализ', 'не успевает в срок ' + fmt(s1.st[2].q) + ' заявок в день'],
                     ['mid', 'Юристы и выдача', 'работы стало меньше, люди простаивают'],
                     ['bad', 'Банк', 'минус ' + kr(m0 - m1) + ' в месяц, заявок с нарушением срока ' + d1 + ' вместо ' + d0]]);
    }
    return '<p>Показатели банка не изменились. А если бы премию ввели, заявок в анализ стало бы ' + apps1 + ' в день вместо ' + apps0 + ' — KPI продаж вырос бы. Но среди них было бы много компаний, которые сейчас отсеиваются на первом звонке. Аналитики не успевали бы их разбирать, одобряли бы только ' + pct(s1.p.a) + ', и банк выдавал бы ' + kr(m1) + ' в месяц вместо ' + m0 + ', а срок нарушали бы у ' + zv(d1) + ' в месяц вместо ' + d0 + '.</p>';
  }
  if (n === 1) {
    var inL = s0.st[3].inn;
    var inLtxt = fmt(inL) + ' ' + pl(inL, 'заявка', 'заявки', 'заявок');
    var qA = s0.st[2].q;
    if (yes) {
      return '<p>Юристы теперь могут готовить 24 договора в день, но к ним поступает только ' + inLtxt + ': больше одобренных заявок кредитный анализ не выпускает. Банк выдаёт те же ' + kr(m0) + ', срок нарушен у тех же ' + zv(d0) + ', а 3 млн ₽ потрачены зря.</p>'
        + '<div class="def">' + DEF + '</div>'
        + linesHtml([['mid', 'Юристы', 'загрузка упала с ' + pct(inL / 15) + ' до ' + pct(inL / 24) + ': новая мощность простаивает'],
                     ['bad', 'Кредитный анализ', 'по-прежнему не успевает в срок ' + fmt(qA) + ' ' + pl(qA, 'заявку', 'заявки', 'заявок') + ' в день']]);
    }
    return '<p>Показатели банка не изменились — и это правильно. К юристам поступает ' + inLtxt + ' в день, а успевают они 15, то есть и так справляются. Система подняла бы их до 24, но банк выдавал бы те же ' + kr(m0) + ': больше одобренных заявок кредитный анализ не выпускает. 3 млн ₽ остались в бюджете.</p>'
      + '<div class="def">' + DEF + '</div>';
  }
  /* n === 2 */
  var a0 = pct(s0.p.a), a1 = pct(s1.p.a);
  if (yes) {
    var loadL = s1.st[3].inn / s1.st[3].cap;
    return '<p>По старому KPI маркетинг выглядит хуже: обращений 24 вместо 30. Зато одобряют теперь ' + a1 + ' заявок вместо ' + a0 + ': компания, которая работает больше года, — более надёжный заёмщик. Банк выдаёт ' + kr(m1) + ' в месяц вместо ' + m0 + ', ' + lateChange(d0, d1) + '.</p>'
      + linesHtml([s0.p.k > 0.9
                     ? ['ok', 'Продажи', 'обращения стали качественнее, хотя премия по-прежнему подталкивает передавать в анализ всех']
                     : ['ok', 'Продажи', 'меньше пустых звонков: из 24 обращений ' + fmt(s1.st[2].inn) + ' становятся заявками'],
                   ['ok', 'Кредитный анализ', s1.st[2].q < s0.st[2].q - 0.01 ? 'нарушений срока меньше, одобренных заявок больше' : 'работы столько же, а одобренных заявок больше'],
                   loadL >= 0.85 ? ['mid', 'Юристы', 'загрузка ' + pct(loadL) + ' — следующее узкое место может появиться здесь'] : ['ok', 'Юристы', 'работы прибавилось, загрузка ' + pct(loadL)]]);
  }
  return '<p>Показатели банка не изменились, а могли вырасти. Обращений стало бы 24 вместо 30, и по старому KPI маркетинг выглядел бы хуже. Но одобряли бы ' + a1 + ' заявок вместо ' + a0 + ': компания, которая работает больше года, — более надёжный заёмщик. Банк выдавал бы ' + kr(m1) + ' в месяц вместо ' + m0 + '.</p>';
}

function boostBody(v, s0, s1) {
  var m0 = s0.month, m1 = s1.month, d0 = s0.late, d1 = s1.late;
  if (v === 0) {
    return 'Обращений стало ' + fmt(s1.p.L) + ', но продажи успевают обработать только 30 — теперь и они не успевают в срок. Кредитов столько же — ' + m0 + ', а ' + lateChange(d0, d1) + '. Больше обращений не помогают, если поток упирается в отдел дальше по цепочке.';
  }
  if (v === 1) {
    return 'Продажи и так справлялись: к ним поступает ' + fmt(s0.p.L) + ' ' + pl(s0.p.L, 'обращение', 'обращения', 'обращений') + ' в день, а успевают они 30, очереди нет. Новые менеджеры будут недогружены, а кредитный анализ по-прежнему не успевает в срок. Банк выдаёт те же ' + kr(m0) + '.';
  }
  if (v === 2) {
    var inA = s1.st[2].inn;
    var t = 'Теперь анализ успевает ' + s1.p.Ca + ' ' + pl(s1.p.Ca, 'заявку', 'заявки', 'заявок') + ' в день';
    t += s1.st[2].q > 0.01
      ? ', а поступает ' + fmt(inA) + '. Нарушений срока стало меньше, но они остались: слабые заявки от продаж по-прежнему занимают аналитиков.'
      : ' при ' + fmt(inA) + ' поступающих — все заявки укладываются в срок.';
    t += ' Банк выдаёт ' + kr(m1) + ' вместо ' + m0 + ', ' + lateChange(d0, d1) + '.';
    var lw = s1.st[3];
    t += lw.inn / lw.cap >= 0.95
      ? ' Теперь на пределе юристы — следующее узкое место будет у них.'
      : ' Улучшение в узком месте сразу сдвинуло результат всей цепочки.';
    return t;
  }
  if (v === 3) {
    var inL = s0.st[3].inn;
    return 'К юристам поступает ' + fmt(inL) + ' ' + pl(inL, 'заявка', 'заявки', 'заявок') + ' в день, а успевают они ' + s0.p.Cl + ' — и так справлялись. Новые люди будут недогружены, а банк выдаёт те же ' + kr(m0) + '.';
  }
  var inP = s0.st[4].inn;
  return 'Выдача загружена на ' + pct(inP / 20) + ': поступает ' + fmt(inP) + ' ' + pl(inP, 'договор', 'договора', 'договоров') + ' в день, а успевает она 20. Новые сотрудники ничего не изменят: банк выдаёт те же ' + kr(m0) + ', а кредитный анализ по-прежнему не успевает в срок.';
}

function feedbackHtml() {
  if (!answered()) {
    return '<div class="hint">' + (state.i < 3
      ? 'Решите — и расчёт обновится.'
      : 'Нажмите на отдел в схеме или в таблице — и расчёт обновится.') + '</div>';
  }
  var ok, head, body;
  var s0 = sim(preP());
  if (state.i < 3) {
    var r = ROUNDS[state.i], ans = state.answers[state.i];
    ok = ans === r.right;
    head = (ok ? 'Верно · ' : 'Неверно · ') + r.tag;
    body = roundBody(state.i, ans === 'yes', s0, sim(params(flagsWith(state.i, 'yes'))));
  } else {
    var b = state.answers[3];
    ok = b === 2;
    head = ok ? 'Верно · это узкое место' : 'Неверно · узкое место в кредитном анализе';
    body = '<p>' + boostBody(b, s0, sim(curP())) + '</p>';
  }
  return '<div class="feedback ' + (ok ? 'feedback--success' : 'feedback--error') + '">'
    + '<div class="feedback__head">' + head + '</div>' + body + '</div>';
}

/* ─── Экраны ────────────────────────────────────────────── */

function renderIntro() {
  var p0 = params(flagsBefore(0)), s0 = sim(p0);
  return '<div class="page-wrap--compact screen anim-fade-up">'
    + '<div class="screen__body screen__body--center">'
    +   '<h1 class="page-title">Где тормозит<span>поток заявок</span></h1>'
    +   '<div class="divider"></div>'
    +   '<p class="lead-text">Банк выдаёт кредиты малому бизнесу. Заявка проходит через пять отделов. Результат каждого отдела — сырьё для следующего, то есть для его внутреннего клиента. Всё начинается с обращений — запросов на кредит, которые компании оставляют после рекламы.</p>'
    +   '<div class="mt-sm">' + calcHtml(p0, 'view') + '</div>'
    +   '<p class="lead-text mt-sm"><strong>Поступает</strong> — сколько работы приходит в отдел за день, <strong>успевает</strong> — сколько он может обработать. Если поступает больше, часть работы не успевают сделать в срок. По пути часть потока отсеивается: из обращений продажи оформляют в заявку ' + pct(p0.k) + ', а кредитный анализ одобряет ' + pct(p0.a) + ' заявок. Банк обещает клиенту деньги за ' + PROMISE + ' дней. Заявки, которые отдел не успел разобрать за день, переходят на следующий — и обещанный срок для этих клиентов нарушается. Сейчас банк выдаёт ' + kr(s0.month) + ' в месяц, и ' + zv(s0.late) + ' в месяц разбирают с нарушением срока.</p>'
    +   '<p class="lead-text mt-xs">В трёх раундах руководители отделов предлагают изменения — решите, поддержать ли их. В четвёртом вы сами выберете, куда вложиться.</p>'
    + '</div>'
    + '<button class="btn btn--primary btn--full mt-md" onclick="start()">Начать →</button>'
    + '</div>';
}

function renderRound() {
  var last = state.i === 3;
  var who, text;
  if (!last) {
    who = ROUNDS[state.i].who;
    text = ROUNDS[state.i].text;
    if (typeof text === 'function') text = text(preP(), params(flagsWith(state.i, 'yes')));
  }
  else {
    who = 'Решение за вами';
    text = 'Банк выделил деньги на двух новых сотрудников. Они добавят: маркетингу +8 обращений в день, продажам +10, кредитному анализу +4, юристам +6, выдаче +8. В какой отдел их взять?';
  }
  var mode = last ? (answered() ? 'picked' : 'pick') : 'view';
  return '<div class="page-wrap--compact screen anim-fade-up">'
    + '<div class="screen__body">'
    +   progressHtml()
    +   '<div class="card prop mt-xs"><div class="prop__who">' + who + '</div><div class="prop__text">' + text + '</div></div>'
    +   ctxHtml()
    +   '<div class="flow-label mt-sm" id="flowlbl">' + flowLabel() + '</div>'
    +   '<div class="mt-xs" id="calcbox">' + calcHtml(curP(), mode, preP()) + '</div>'
    +   (last ? '' : '<div class="mt-sm">' + decHtml() + '</div>')
    +   '<div id="fbbox" class="fb-zone mt-sm">' + feedbackHtml() + '</div>'
    + '</div>'
    + '<div class="nav-bar">'
    +   '<button id="next-btn" class="btn btn--primary btn--full" onclick="next()"' + (answered() ? '' : ' disabled') + '>'
    +     (last ? 'К итогам →' : 'Дальше →')
    +   '</button>'
    + '</div>'
    + '</div>';
}

function flowLabel() {
  if (!answered()) return state.i === 3 ? 'Сейчас · нажмите на отдел' : 'Сейчас';
  if (state.i === 3) return 'С двумя новыми сотрудниками';
  return state.answers[state.i] === 'yes' ? 'После вашего решения' : 'После вашего решения · без изменений';
}

/* Строка расчёта для итогов: «без — с» по дневному потоку */
function calcLine(off, on, s0, s1) {
  return off + ': ' + fmt(s0.daily) + ' в день × ' + DAYS + ' = ' + kr(s0.month) + '. '
    + on + ': ' + fmt(s1.daily) + ' × ' + DAYS + ' = ' + kr(s1.month) + '.';
}

function renderResult() {
  var rows = '';
  for (var k = 0; k < 3; k++) {
    var r = ROUNDS[k], yes = state.answers[k] === 'yes';
    var ok = state.answers[k] === r.right;
    var s0 = sim(params(flagsWith(k, 'no'))), s1 = sim(params(flagsWith(k, 'yes')));
    var d = s1.month - s0.month;
    var eff;
    if (yes) eff = d === 0 ? 'кредитов столько же, −3 млн ₽' : (d > 0 ? '+' : '−') + kr(Math.abs(d)) + ' в месяц';
    else if (d > 0) eff = 'упущено: +' + kr(d) + ' в месяц';
    else if (d < 0) eff = 'без потерь, а могло быть −' + kr(-d) + ' в месяц';
    else eff = '3 млн ₽ сэкономлены';
    var calc = calcLine(r.off, r.on, s0, s1);
    if (k === 1) calc += ' Система стоит 3 млн ₽, а кредитов с ней ' + (d === 0 ? 'столько же.' : 'больше на ' + kr(d) + '.');
    rows += '<div class="sum__row"><span class="dot dot--' + (ok ? 'ok' : 'bad') + '"></span>'
      + '<div class="sum__main"><div class="sum__step">' + r.tag + '</div>'
      + '<div class="sum__text">' + r.sum + ': вы ' + (yes ? 'поддержали' : 'не поддержали') + '</div>'
      + '<div class="sum__calc">' + calc + '</div></div>'
      + '<div class="sum__eff">' + eff + '</div></div>';
  }
  var b = state.answers[3];
  var sb0 = sim(params(flagsBefore(3))), sb1 = sim(finalP());
  var db = sb1.month - sb0.month;
  rows += '<div class="sum__row"><span class="dot dot--' + (b === 2 ? 'ok' : 'bad') + '"></span>'
    + '<div class="sum__main"><div class="sum__step">узкое место</div>'
    + '<div class="sum__text">Двух новых сотрудников вы взяли в отдел «' + NAMES[b] + '»</div>'
    + '<div class="sum__calc">' + calcLine('До найма', 'После', sb0, sb1) + '</div></div>'
    + '<div class="sum__eff">' + (db > 0 ? '+' + kr(db) + ' в месяц' : 'кредитов столько же') + '</div></div>';

  var st0 = sim(params(flagsBefore(0))), fin = sim(finalP());
  return '<div class="page-wrap--compact screen anim-fade-up">'
    + '<div class="screen__body screen__body--center">'
    +   '<h2 class="section-title">К чему привели ваши решения</h2>'
    +   '<div class="divider"></div>'
    +   '<p class="lead-text">Начинали с ' + kr(st0.month) + ' в месяц и ' + st0.late + ' заявок с нарушением срока. После ваших решений банк выдаёт <strong>' + kr(fin.month) + '</strong>, а с нарушением срока разбирают <strong>' + zv(fin.late) + '</strong>. Каждое решение сравниваем с тем, как было бы без него.</p>'
    +   '<div class="sum mt-sm">' + rows + '</div>'
    +   '<div class="legend-box">'
    +     '<span class="legend-tag">Главное</span>'
    +     'KPI отдела и результат компании могут расходиться: премия продажам поднимает их показатель, но банк выдаёт меньше кредитов. '
    +     'Прежде чем менять что-то в своём отделе, стоит спросить: <strong>что получит мой внутренний клиент и где сейчас узкое место?</strong> Улучшение в любом другом месте поток не ускорит.'
    +   '</div>'
    + '</div>'
    + '<button class="btn btn--secondary btn--full mt-sm" onclick="restart()">Пройти заново</button>'
    + '</div>';
}

/* ─── Управление ────────────────────────────────────────── */

function render() {
  var h = '';
  if (state.screen === 'intro') h = renderIntro();
  else if (state.screen === 'q') h = renderRound();
  else h = renderResult();
  document.getElementById('app').innerHTML = h;
  notifyHeight();
}

function start() {
  state.screen = 'q';
  state.i = 0;
  state.answers = [];
  render();
}

/* Решение обновляет блоки на месте, без перерисовки экрана */
function refresh() {
  var last = state.i === 3;
  document.getElementById('flowlbl').innerHTML = flowLabel();
  document.getElementById('calcbox').innerHTML = calcHtml(curP(), last ? 'picked' : 'view', preP());
  if (!last) document.getElementById('dec').outerHTML = decHtml();
  document.getElementById('fbbox').innerHTML = feedbackHtml();
  document.getElementById('next-btn').disabled = false;
  notifyHeight();
}

function decide(v) {
  if (answered()) return;
  state.answers[state.i] = v;
  refresh();
}

function pickBoost(i) {
  if (answered()) return;
  state.answers[3] = i;
  refresh();
}

function next() {
  if (state.i === 3) state.screen = 'result';
  else state.i++;
  render();
}

function restart() {
  state.screen = 'intro';
  state.i = 0;
  state.answers = [];
  render();
}

render();
</script>
</body>
</html>
