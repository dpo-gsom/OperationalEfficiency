<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Один пилот и три уровня</title>
<link rel="stylesheet" href="styles.css">
<style>
  /* ─── Экран: фиксированная высота, чтобы iframe не прыгал ─── */
  .screen { min-height: 700px; }
  .screen__body { flex: 1; display: flex; flex-direction: column; }
  .screen__body--center { justify-content: center; }

  /* ─── Вводный экран ─── */
  .given { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .given__item { padding: 10px 12px; background: var(--white); border: 1.5px solid var(--border); border-radius: var(--radius-md); }
  .given__num { font-family: var(--font-display); font-size: 19px; font-weight: 900; color: var(--dark); line-height: 1.2; }
  .given__txt { font-size: 12px; color: var(--slate); line-height: 1.35; }

  .lv-list { display: flex; flex-direction: column; gap: 6px; }
  .lv-item { padding: 8px 12px; background: var(--white); border: 1.5px solid var(--border); border-left: 4px solid var(--dark); border-radius: var(--radius-md); font-size: 13px; line-height: 1.4; color: var(--slate); }
  .lv-item strong { color: var(--dark); }
  .lv-item:nth-child(2) { border-left-color: var(--amber); }
  .lv-item:nth-child(3) { border-left-color: var(--red); }

  /* ─── Развилка ─── */
  .sit { padding: 14px 16px; }
  .sit__title { font-family: var(--font-display); font-size: 18px; font-weight: 700; color: var(--dark); line-height: 1.25; }
  .sit__text { font-size: 14px; color: var(--slate); line-height: 1.55; margin-top: 6px; }

  .opts { display: flex; flex-direction: column; gap: 8px; }
  .opt { padding: 11px 14px; font-size: 14px; line-height: 1.45; color: var(--dark); }
  .opt--locked { cursor: default; pointer-events: none; }
  .opt--gone { display: none; }

  /* ─── Разбор ─── */
  .fb-zone { display: flex; flex-direction: column; }
  .fb-zone .hint {
    font-size: 13px;
    color: var(--slate);
    text-align: center;
    padding: 18px 10px;
    border: 1.5px dashed var(--border);
    border-radius: var(--radius-md);
  }
  .levels { margin-top: 10px; padding-top: 9px; border-top: 1px solid rgba(0, 0, 0, .08); display: flex; flex-direction: column; gap: 5px; }
  .lvl { display: flex; gap: 8px; align-items: baseline; font-size: 13px; line-height: 1.4; color: var(--slate); }
  .lvl b { color: var(--dark); font-weight: 600; }
  .dot { flex-shrink: 0; width: 9px; height: 9px; border-radius: 50%; position: relative; top: 1px; }
  .dot--ok  { background: var(--green); }
  .dot--mid { background: #D9A400; }
  .dot--bad { background: var(--red); }

  /* ─── Итог ─── */
  .path { display: flex; flex-direction: column; gap: 6px; }
  .path__row { display: flex; gap: 10px; align-items: flex-start; padding: 9px 12px; background: var(--white); border: 1.5px solid var(--border); border-radius: var(--radius-md); }
  .path__row .dot { top: 5px; }
  .path__main { flex: 1; min-width: 0; }
  .path__step { font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--slate); }
  .path__choice { font-size: 14px; color: var(--dark); line-height: 1.35; }
  .path__tag { flex-shrink: 0; font-size: 11px; line-height: 1.3; color: var(--slate); text-align: right; max-width: 150px; padding-top: 2px; }
  .signs { display: flex; flex-wrap: wrap; gap: 6px; }

  .real { font-size: 14px; line-height: 1.5; color: var(--slate); }
  .real li { margin-left: 18px; }
  .real li + li { margin-top: 4px; }
  .real__head { font-size: 13px; font-weight: 700; color: var(--dark); }

  @media (max-width: 560px) {
    .given { grid-template-columns: 1fr; gap: 6px; }
    .given__item { display: flex; align-items: baseline; gap: 10px; padding: 8px 12px; }
    .given__num { font-size: 17px; flex-shrink: 0; min-width: 92px; }
    .sit { padding: 12px 14px; }
    .sit__title { font-size: 17px; }
    .path__row { flex-wrap: wrap; }
    .path__tag { flex-basis: 100%; text-align: left; max-width: none; padding: 0 0 0 19px; }
    .screen { min-height: 980px; }
  }
</style>
</head>
<body>

<div id="app"></div>

<script src="common.js"></script>
<script>
/* =========================================================
   Один пилот и три уровня
   Розничная сеть внедряет систему прогнозирования спроса.
   Ученик — руководитель проекта внедрения, пять развилок.
   В разборе — что было дальше и как это отразилось на каждом уровне.
   В финале — путь ученика и как было на самом деле.
   ========================================================= */

var LV = ['Корпоративный', 'ИТ', 'Закупки и склад'];

var TYPES = {

/* Опции: type — ok / gap / bureau / res; mech — механизм согласования;

    opts: [

        label: 'ИТ — запустить систему к сроку. Закупкам — к концу квартала делать 90% заказов через новую систему.',
        short: 'Каждой команде — своя цифра',

        lv: [['ok', 'Сроки и цифры есть, отчитываться есть чем.'], ['mid', 'Работают на срок, а не на точность прогноза.'], ['bad', 'Заказывают через систему, даже когда она ошибается.']]
      },
      {
        label: 'Дать обеим командам общую цель — меньше списаний и товар на полках в пилотных магазинах. ИТ отвечает за точность прогноза, закупки — за то, чтобы на время перехода полки были не хуже, чем сейчас.',
        short: 'Общая цель и свой показатель у каждого',

        lv: [['ok', 'Цель совета разложена на понятные задачи.'], ['ok', 'Отвечают за точность прогноза, а не только за срок.'], ['ok', 'Знают, что главное — товар на полках.']]

    opts: [
      {
        label: 'Срок важнее всего: снять трёх разработчиков со всех проектов, обновление касс и подготовку к инвентаризации отложить.',

        type: 'res',
        scene: 'Система к сроку будет. Но обновление касс встало, а к июньской инвентаризации никто не готовит программы. Операционный директор идёт к генеральному: проект забрал людей, которые нужны всей сети.',

      },
      {
        label: 'Собрать ИТ, операционного директора и закупки и договориться о графике: пилот стартует после июньской инвентаризации, закупщикам оплачивают часы работы в двух системах.',

        mech: 'диалог «планирование — проверка»',

          return s.small

      }

    title: 'Склад',
    text: 'Первые недели система будет ошибаться, поэтому логисты просят страховой запас ходовых товаров. Директор склада: «Места нет, еле вмещаем текущий товар. Освободить площадь можно, только если закупать меньше, — но тогда потеряем оптовые скидки».',

      },

        label: 'Освободить место под запас по всей сети: на квартал сократить закупки у поставщиков.',

        type: 'res',
        scene: 'Полки заполнили за день. Но руководство о сбое не знает и ждёт отчёта инвесторам по плану. Закупщики работают за двоих — и вручную, и в системе, — и непонятно, сколько это продлится.',

        label: 'Подготовить отчёт: пилот идёт по плану, отдельные отклонения в пределах нормы, к встрече система будет донастроена.',
        short: 'Отчёт «всё по плану»',
        type: 'bureau',
        scene: 'Отчёт приняли. Через три недели инвесторам показывают рост маржи на слайдах, а в пилотных магазинах сбои продолжаются — теперь с хлебом. Правда всё равно выйдет наружу, только позже и дороже.',
        lv: [['bad', 'Обещает инвесторам то, чего нет.'], ['bad', 'Времени на исправление нет — срок прежний.'], ['bad', 'Пустые полки повторяются.']]
      }
    ]
  }
];

var state = { screen: 'intro', i: 0, answers: [] };

/* ─── Вспомогательные ───────────────────────────────────── */

function flags() {
  var a = state.answers;
  return {
    small: a[1] !== undefined && STEPS[1].opts[a[1]].type === 'ok',
    stock: a[3] !== undefined && STEPS[3].opts[a[3]].type === 'ok'
  };
}

function val(x) { return typeof x === 'function' ? x(flags()) : x; }

function answered() { return state.answers[state.i] !== undefined; }

function progressHtml() {
  return '<div class="progress">'
    + '<div class="progress__meta">'
    +   '<span class="progress__label">Решение</span>'
    +   '<span class="progress__fraction"><em>' + (state.i + 1) + '</em> / ' + STEPS.length + '</span>'
    + '</div>'
    + '<div class="progress__track"><div class="progress__fill" style="width:' + (state.i / STEPS.length * 100) + '%"></div></div>'
    + '</div>';
}

function optsHtml() {
  var st = STEPS[state.i], ans = state.answers[state.i];
  var h = '<div class="opts" id="opts">';
  for (var k = 0; k < st.opts.length; k++) {
    var cls = 'card opt';
    if (ans === undefined) cls += ' card--interactive';
    else if (k !== ans) cls += ' opt--gone';
    else cls += ' opt--locked ' + (st.opts[k].type === 'ok' ? 'card--correct' : 'card--wrong');
    h += '<div class="' + cls + '" data-k="' + k + '"' + (ans === undefined ? ' onclick="pick(' + k + ')"' : '') + '>' + st.opts[k].label + '</div>';
  }
  return h + '</div>';
}

function feedbackHtml() {
  if (!answered()) return '<div class="hint">Выберите решение — здесь появится, что было дальше.</div>';
  var o = STEPS[state.i].opts[state.answers[state.i]];
  var ok = o.type === 'ok';
  var head = ok ? 'Интересы согласованы' + (o.mech ? ' · ' + o.mech : '') : TYPES[o.type];
  var lv = val(o.lv), rows = '';
  for (var k = 0; k < 3; k++) {
    rows += '<div class="lvl"><span class="dot dot--' + lv[k][0] + '"></span><span><b>' + LV[k] + ':</b> ' + lv[k][1] + '</span></div>';
  }
  return '<div class="feedback ' + (ok ? 'feedback--success' : 'feedback--error') + '">'
    + '<div class="feedback__head">' + head + '</div>'
    + '<p>' + val(o.scene) + '</p>'
    + '<div class="levels">' + rows + '</div>'
    + '</div>';
}

/* ─── Экраны ────────────────────────────────────────────── */

function renderIntro() {
  return '<div class="page-wrap--compact screen anim-fade-up">'
    + '<div class="screen__body screen__body--center">'
    +   '<h1 class="page-title">Один пилот<span>и три уровня</span></h1>'
    +   '<div class="divider"></div>'
    +   '<p class="lead-text">Сеть продуктовых магазинов «у дома», около 300 точек в регионе. Совет директоров решил сократить списания хлеба, молочных продуктов и овощей и при этом не допускать пустых полок. Для этого внедряют систему прогнозирования спроса на основе искусственного интеллекта — она заменит ручной заказ. Сначала её проверят на пилоте в 60 магазинах.</p>'
    +   '<p class="lead-text mt-sm">Вас назначили руководителем проекта внедрения.</p>'
    +   '<div class="given mt-xs">'
    +     '<div class="given__item"><div class="given__txt">Цель от совета директоров - снизить % списания продуктов</div><div class="given__num">−15%</div></div>'
    +     '<div class="given__item"><div class="given__txt">Бюджет на реализацию проекта</div><div class="given__num">50 млн ₽</div></div>'
    +     '<div class="given__item"><div class="given__txt">Презентация результатов инвесторам через</div><div class="given__num">3 месяца</div></div>'
    +   '</div>'
    +   '<p class="lead-text mt-sm">У каждого уровня свои задачи:</p>'
    +   '<div class="lv-list mt-xs">'
    +     '<div class="lv-item"><strong>Корпоративный</strong> — совет директоров и генеральный директор: быстро показать результат инвесторам.</div>'
    +     '<div class="lv-item"><strong>ИТ</strong> — связать новую систему с устаревшей 1С, обучить людей, не сломать текущую работу.</div>'
    +     '<div class="lv-item"><strong>Закупки и склад</strong> — каждый день держать товар на полках, пока система учится.</div>'
    +   '</div>'
    +   '<p class="lead-text mt-sm">Впереди пять решений. После каждого увидите, что было дальше и как это отразилось на каждом уровне. В конце — как всё сложилось в реальной компании.</p>'
    + '</div>'
    + '<button class="btn btn--primary btn--full mt-md" onclick="start()">Начать →</button>'
    + '</div>';
}

function renderQuestion() {
  var st = STEPS[state.i];
  return '<div class="page-wrap--compact screen anim-fade-up">'
    + '<div class="screen__body">'
    +   progressHtml()
    +   '<div class="card sit mt-sm"><div class="sit__title">' + st.title + '</div><div class="sit__text">' + st.text + '</div></div>'
    +   '<div class="mt-sm">' + optsHtml() + '</div>'
    +   '<div id="fbbox" class="fb-zone mt-sm">' + feedbackHtml() + '</div>'
    + '</div>'
    + '<div class="nav-bar">'
    +   '<button id="next-btn" class="btn btn--primary btn--full" onclick="next()"' + (answered() ? '' : ' disabled') + '>'
    +     (state.i === STEPS.length - 1 ? 'К итогам →' : 'Дальше →')
    +   '</button>'
    + '</div>'
    + '</div>';
}

function renderPath() {
  var okN = 0, seen = {}, rows = '', signs = '';
  for (var k = 0; k < STEPS.length; k++) {
    var o = STEPS[k].opts[state.answers[k]];
    var ok = o.type === 'ok';
    if (ok) okN++; else seen[o.type] = true;
    rows += '<div class="path__row"><span class="dot dot--' + (ok ? 'ok' : 'bad') + '"></span>'
      + '<div class="path__main"><div class="path__step">' + (k + 1) + ' · ' + STEPS[k].title + '</div>'
      + '<div class="path__choice">' + o.short + '</div></div>'
      + '<div class="path__tag">' + (ok ? 'согласовано' : TYPES[o.type].toLowerCase()) + '</div></div>';
  }
  for (var t in TYPES) if (seen[t]) signs += '<span class="badge badge--error">' + TYPES[t] + '</span>';

  var title, lead;
  if (okN === STEPS.length) {
    title = 'Уровни договорились';
    lead = 'На каждой развилке вы искали решение, которое не перекладывает проблему с одного уровня на другой. Сбои в пилоте были, но о них знали и их исправляли.';
  } else if (okN >= 3) {
    title = 'Согласованность с пробелами';
    lead = 'Часть решений связала интересы уровней, а часть переложила проблему на соседей. Ниже видно, где именно.';
  } else {
    title = 'Каждый уровень сам за себя';
    lead = 'Почти каждое решение было удобно одному уровню и переносило проблему на другой. Реальная компания прошла примерно этим путём.';
  }

  return '<div class="page-wrap--compact screen anim-fade-up">'
    + '<div class="screen__body screen__body--center">'
    +   '<h2 class="section-title">' + title + '</h2>'
    +   '<div class="divider"></div>'
    +   '<p class="lead-text">' + lead + '</p>'
    +   '<div class="path mt-sm">' + rows + '</div>'
    +   (signs ? '<p class="real__head mt-sm">Что проявилось на вашем пути:</p><div class="signs mt-xs">' + signs + '</div>' : '')
    + '</div>'
    + '<button class="btn btn--primary btn--full mt-md" onclick="go(\'real\')">Как было на самом деле →</button>'
    + '</div>';
}

function renderReal() {
  return '<div class="page-wrap--compact screen anim-fade-up">'
    + '<div class="screen__body screen__body--center">'
    +   '<h2 class="section-title">Как было на самом деле</h2>'
    +   '<div class="divider"></div>'
    +   '<p class="lead-text">В реальной компании ресурсы поделили так, чтобы никому не отказать совсем:</p>'
    +   '<ul class="real mt-xs">'
    +     '<li>50 млн дали на ПО и консультантов, ещё 15 млн на доработки и инфраструктуру — нет;</li>'
    +     '<li>ИТ-команда работала над проектом только по вечерам, после основной работы;</li>'
    +     '<li>страховой запас на складе не создавали;</li>'
    +     '<li>закупщикам разрешили дублировать заказы вручную в свободное время.</li>'
    +   '</ul>'
    +   '<p class="real__head mt-sm">Через два месяца:</p>'
    +   '<ul class="real mt-xs">'
    +     '<li>система давала сбои на 20% товарных позиций — на настройку не хватило времени;</li>'
    +     '<li>в пилотных магазинах три дня не было ходовых йогуртов, выручка этих точек упала на 30%;</li>'
    +     '<li>один закупщик уволился от переработок, заменить его было некем;</li>'
    +     '<li>обновление касс забросили — в двух магазинах зависли терминалы и выросли очереди.</li>'
    +   '</ul>'
    +   '<div class="legend-box">'
    +     '<span class="legend-tag">Главное</span>'
    +     'Каждый уровень боролся за свою долю — деньги, время людей, место на складе, — и никто не свёл эти запросы в общий баланс. '
    +     'Затраты на внедрение выросли, списания почти не изменились, а товара на полках стало меньше. <strong>Операционная эффективность упала, а не выросла.</strong>'
    +   '</div>'
    + '</div>'
    + '<div class="nav-bar mt-sm">'
    +   '<button class="btn btn--secondary" onclick="go(\'path\')">← Мой путь</button>'
    +   '<button class="btn btn--primary" onclick="restart()">Пройти заново</button>'
    + '</div>'
    + '</div>';
}

/* ─── Управление ────────────────────────────────────────── */

function render() {
  var h = '';
  if (state.screen === 'intro') h = renderIntro();
  else if (state.screen === 'q') h = renderQuestion();
  else if (state.screen === 'path') h = renderPath();
  else h = renderReal();
  document.getElementById('app').innerHTML = h;
  notifyHeight();
}

function start() {
  state.screen = 'q';
  state.i = 0;
  state.answers = [];
  render();
}

/* Выбор обновляет блоки на месте: остальные варианты прячутся,
   высота экрана не меняется за счёт min-height */
function pick(k) {
  if (answered()) return;
  state.answers[state.i] = k;
  document.querySelector('#opts').outerHTML = optsHtml();
  document.getElementById('fbbox').innerHTML = feedbackHtml();
  document.getElementById('next-btn').disabled = false;
  notifyHeight();
}

function next() {
  if (state.i === STEPS.length - 1) state.screen = 'path';
  else state.i++;
  render();
}

function go(screen) {
  state.screen = screen;
  render();
}

function restart() {
  state.screen = 'intro';
  state.i = 0;
  state.answers = [];
  render();
}

render();
</script>
</body>
</html>
